# Halaman Peraturan (regulations.html). Samakan setiap id dengan versi bahasa Inggris.
# area: make (membuat dan mendaftarkan alat), buy (membelinya), use (memakai alat dan data).
# Saat memeriksa ulang, perbarui status dan tanggal "diperiksa" di bagian atas id/regulations.html.
# Gunakan pasal.id atau peraturan.bpk.go.id untuk melihat apakah aturan sudah diubah atau dicabut.

- id: health-law
  area: make
  name: Undang-Undang Nomor 17 Tahun 2023 tentang Kesehatan
  url: https://peraturan.bpk.go.id/Details/258028
  covers: >-
    Undang-undang utama bidang kesehatan. Di antaranya mewajibkan izin edar untuk alat kesehatan.
  status: Berlaku. Peraturan pelaksananya adalah Peraturan Pemerintah Nomor 28 Tahun 2024.
  guides: '[A](regulation.html), [D](to-market.html)'

- id: business-licensing
  area: make
  name: Peraturan Pemerintah Nomor 28 Tahun 2025, dan Peraturan Menteri Kesehatan Nomor 11 Tahun 2025
  url: https://jdih.kemkes.go.id/documents/peraturan-menteri-kesehatan-nomor-11-tahun-2025
  covers: >-
    Perizinan berusaha berbasis risiko melalui OSS, termasuk perizinan produksi dan distribusi alat
    kesehatan.
  status: >-
    Berlaku sejak Oktober 2025. Peraturan Nomor 11 Tahun 2025 menggantikan Peraturan Menteri
    Kesehatan Nomor 14 Tahun 2021.
  changed: true
  guides: '[D](to-market.html)'

