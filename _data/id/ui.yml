# The two halves of the site
pillars:
  build:
    label: Kembangkan
    heading: Mengembangkan teknologi kesehatan
    lead: >-
      Untuk inovator, peneliti, insinyur, dan tim teknologi rumah sakit. Dari kebutuhan klinis sampai
      alat yang boleh dijual di Indonesia, serta cara memakai dan membagikan teknologi sumber terbuka.
  buy:
    label: Beli
    heading: Membeli alat kesehatan
    lead: >-
      Untuk pejabat pengadaan, klinisi, petugas teknis, dan perencana: apa yang harus diminta, berapa
      harga yang wajar, dan bagaimana menjalankan tendernya.

