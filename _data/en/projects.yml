# Open projects page (projects.html). Keep the id the same in both languages.
# kind: hardware or software. Listing a project is not a recommendation: say what it is,
# what licence it uses, and what its own documents say about medical use. Cite, do not praise.

- id: openflexure-microscope
  name: OpenFlexure Microscope
  url: https://openflexure.org/projects/microscope/
  kind: hardware
  what: A laboratory microscope with a motorised stage, made mostly from 3D-printed parts.
  licence: CERN-OHL-S version 2 (reciprocal)
  status: >-
    Not certified as a medical device. Partners in Tanzania are working towards certification
    for malaria screening ([project page](https://openflexure.org/about/malaria)).

- id: openmrs
  name: OpenMRS
  url: https://openmrs.org/
  kind: software
  what: An electronic medical record system for health facilities, first built for low-resource settings.
  licence: Mozilla Public License 2.0 with a Healthcare Disclaimer (weakly reciprocal)
  status: Started in 2004. Used in many countries, mostly in Africa.

- id: dhis2
  name: DHIS2
  url: https://dhis2.org/
  kind: software
  what: A system for collecting, reporting and analysing health programme data.
  licence: BSD 3-Clause (permissive)
  status: Coordinated by the University of Oslo. Used by ministries of health in more than 75 countries.

- id: orthanc
  name: Orthanc
  url: https://www.orthanc-server.com/
  kind: software
  what: A lightweight server that stores and shares medical images in the DICOM format.
  licence: GNU GPL version 3 (strongly reciprocal)
  status: Started at the University Hospital of Liège in 2011.

- id: ohif-viewer
  name: OHIF Viewer
  url: https://ohif.org/
  kind: software
  what: A medical image viewer that runs in a web browser.
  licence: MIT (permissive)
  status: >-
    Several commercial viewers cleared by the US Food and Drug Administration are built on it.
    The open project itself is not a cleared device.

- id: 3d-slicer
  name: 3D Slicer
  url: https://www.slicer.org/
  kind: software
  what: Analysis and 3D display of medical images, used mostly in research.
  licence: BSD-style Slicer licence (permissive)
  status: Its documentation says it is not approved for clinical use by any regulator.

- id: simrs-khanza
  name: SIMRS Khanza
  url: https://github.com/mas-elkhanza/SIMRS-Khanza
  kind: software
  what: A hospital information system written in Indonesia, also used by clinics and puskesmas.
  licence: >-
    Aladdin Free Public License: free to use, but it may not be sold. This is not open source as
    the Open Source Initiative defines it.
  status: Its developer reports use in more than 1,000 health facilities in Indonesia.
