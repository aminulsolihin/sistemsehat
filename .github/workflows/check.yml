# Runs on every push and pull request. Fails if docs/ was not rebuilt after a change in src/,
# or if the built site has a broken link, a missing translation or another problem tools/check.py looks for,
# or if a rule has no example or an abbreviation is not in the glossary (tools/content_report.py).
name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site from src/
        run: python src/build.py

      - name: The committed site matches the sources
        run: |
          if [ -n "$(git status --porcelain -- docs drafts)" ]; then
            git status --short -- docs drafts
            echo "::error::docs/ is out of date. Run 'python3 src/build.py' and commit the result."
            exit 1
          fi

      - name: Check links, translations and pages
        run: python tools/check.py

      - name: Check the writing (every rule has an example, every abbreviation is explained)
        run: python tools/content_report.py --strict
