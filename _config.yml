# SistemSehat site settings. GitHub builds the site with Jekyll every time you push.
# Most editing happens elsewhere: see README.md, "Where things are".

title: SistemSehat

# The site's public address. Used for search-engine language links, link previews and sitemap.xml.
# If you move the site to your own domain, change url to it and set baseurl to "".
url: https://aminulsolihin.github.io
baseurl: /sistemsehat

# The tiny script in every page's <head> is allowed by the security policy through this hash.
# It only changes if that script changes (see _layouts/default.html).
inline_script: document.documentElement.classList.add("js")
inline_script_hash: sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U=

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: false          # anchors are set by hand, so they stay the same in both languages
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Files in the repository that are not part of the website.
exclude:
  - README.md
  - WRITING-GUIDE.md
  - drafts
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - src
  - docs
